[package]
name = "vpush"
version = "1.12.277"
edition = "2021"
rust-version = "1.95"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
getrandom = "0.2"
hex = "0.4"
libc = "0.2"
log = "0.4"
hmac = "0.12"
pbkdf2 = "0.12"
serde = { version = "1", features = ["derive"] }
md-5 = "0.10"
num-bigint = "0.4"
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
subtle = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
ureq = "2"
url = "2"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
p256 = { version = "0.13", features = ["ecdsa", "pem", "ecdh"] }
aes-gcm = "0.10"
hkdf = "0.12"
rsa = { version = "0.9.10", features = ["sha2", "pem"] }
rand = "0.8"
wreq = "0.15.3"
wreq-util = "0.1.0"
zhconv = { version = "0.3", default-features = false, features = ["compress", "opencc"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
