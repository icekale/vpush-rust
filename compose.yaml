services:
  vpush-rust:
    build:
      context: .
      dockerfile: Dockerfile
    image: vpush-rust:local
    container_name: vpush-rust
    restart: unless-stopped
    ports:
      # Publish only on the host loopback. Host Caddy still arrives through the Docker
      # bridge gateway (for example 172.17.0.1), not 127.0.0.1, so TRUSTED_PROXIES
      # below includes 172.16.0.0/12. Override it if Caddy uses another network.
      - "127.0.0.1:8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      VPUSH_DB: /app/data/vpush.db
      VPUSH_STATIC: /app/static
      WEB_TOKEN_SECRET: ${WEB_TOKEN_SECRET:?set WEB_TOKEN_SECRET}
      WEB_ALLOW_REGISTER: ${WEB_ALLOW_REGISTER:-0}
      VPUSH_FETCH: ${VPUSH_FETCH:-0}
      IMA_ARCHIVE_ROOT: ${IMA_ARCHIVE_ROOT:-/app/ima-archive}
      IMGBED_BASE_URL: ${IMGBED_BASE_URL:-}
      IMGBED_TOKEN: ${IMGBED_TOKEN:-}
      IMGBED_CHANNEL: ${IMGBED_CHANNEL:-telegram}
      IMGBED_CHANNEL_NAME: ${IMGBED_CHANNEL_NAME:-vpush-imgbed}
      IMGBED_FOLDER: ${IMGBED_FOLDER:-vpush}
      XINCAI_INGEST_TOKEN: ${XINCAI_INGEST_TOKEN:-}
      TRUTH_IMAGE_ORIGIN: ${TRUTH_IMAGE_ORIGIN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_INBOUND: ${TELEGRAM_BOT_INBOUND:-0}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_CREDENTIAL_KEY: ${FEISHU_CREDENTIAL_KEY:-}
      FEISHU_DOCS_APP_SECRET: ${FEISHU_DOCS_APP_SECRET:-}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      CICC_LAB_LOG_DIR: ${CICC_LAB_LOG_DIR:-/app/cicc-lab-logs}
      CICC_LAB_STALE_HOURS: ${CICC_LAB_STALE_HOURS:-36}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.0/8,::1/128,172.16.0.0/12}
      TRUST_X_REAL_IP: ${TRUST_X_REAL_IP:-0}
      SSRF_ALLOW_FAKE_IP: ${SSRF_ALLOW_FAKE_IP:-0}
    volumes:
      - ./data:/app/data
      - ./avatars:/app/static/avatars:ro
      - ${IMA_ARCHIVE_HOST:-/srv/vpush-ima}:/app/ima-archive
      # Host logs are mode 600 owned by ubuntu; the container user needs group or ACL read access.
      - ${CICC_LAB_LOG_HOST:-/data/vpush-ima-cache/logs}:/app/cicc-lab-logs:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
